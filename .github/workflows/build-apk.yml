name: Compilar APK Android - FrameMaster

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔨 Compilar APK Debug con Gradle
        working-directory: ./framemaster-native
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📦 Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: framemaster-native/app/build/outputs/apk/debug/app-debug.apk
          
